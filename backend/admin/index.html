<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Relationship Application — Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: min(1100px, 92%);
            margin: 40px auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .login {
            max-width: 450px;
            margin: 80px auto;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #111;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #ffe8e8;
            color: #b00020;
        }

        .loading {
            display: none;
            margin-top: 15px;
        }

        #dashboard {
            display: none;
        }

        .application {
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 20px;
            margin-top: 18px;
        }

        .application h3 {
            margin-top: 0;
        }

        .logout {
            float: right;
            background: #b00020;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #777;
        }

        @media (max-width: 600px) {
            .container {
                width: 94%;
                margin: 20px auto;
            }

            .card {
                padding: 20px;
            }

            .login {
                margin: 40px auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ==========================================
         LOGIN
    =========================================== -->

    <section
        id="loginSection"
        class="card login"
    >

        <h1>Admin Login</h1>

        <p>
            Relationship Application Dashboard
        </p>

        <form id="loginForm">

            <div class="field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>

        </form>


        <div
            id="loading"
            class="loading"
        >
            Logging in...
        </div>


        <div
            id="loginError"
            class="error"
        ></div>

    </section>


    <!-- ==========================================
         DASHBOARD
    =========================================== -->

    <section
        id="dashboard"
    >

        <div class="card">

            <button
                id="logoutButton"
                class="logout"
            >
                Logout
            </button>

            <h1>
                Relationship Applications
            </h1>

            <p>
                Submitted applications
            </p>

            <div id="applications">
                Loading applications...
            </div>

        </div>

    </section>

</div>


<script>

// ============================================================
// CONFIGURATION
// ============================================================

const API_URL =
    "https://relationship-application-api.onrender.com";


// ============================================================
// ELEMENTS
// ============================================================

const loginSection =
    document.getElementById("loginSection");

const dashboard =
    document.getElementById("dashboard");

const loginForm =
    document.getElementById("loginForm");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const loading =
    document.getElementById("loading");

const loginError =
    document.getElementById("loginError");

const applicationsContainer =
    document.getElementById("applications");

const logoutButton =
    document.getElementById("logoutButton");


// ============================================================
// SHOW ERROR
// ============================================================

function showError(message) {

    loginError.textContent = message;

    loginError.style.display = "block";

}


// ============================================================
// HIDE ERROR
// ============================================================

function hideError() {

    loginError.textContent = "";

    loginError.style.display = "none";

}


// ============================================================
// LOGIN
// ============================================================

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        hideError();

        loading.style.display = "block";

        loginButton.disabled = true;

        try {

            const username =
                usernameInput.value.trim();

            const password =
                passwordInput.value;


            const response =
                await fetch(
                    `${API_URL}/api/admin/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Invalid username or password."
                );

            }


            if (
                !data.token
            ) {

                throw new Error(
                    "The server did not return an admin token."
                );

            }


            localStorage.setItem(
                "adminToken",
                data.token
            );


            showDashboard();


        } catch (error) {

            console.error(
                "Login error:",
                error
            );

            showError(
                error.message ||
                "Unable to connect to the server."
            );

        } finally {

            loading.style.display = "none";

            loginButton.disabled = false;

        }

    }
);


// ============================================================
// SHOW DASHBOARD
// ============================================================

function showDashboard() {

    loginSection.style.display =
        "none";

    dashboard.style.display =
        "block";

    loadApplications();

}


// ============================================================
// LOAD APPLICATIONS
// ============================================================

async function loadApplications() {

    applicationsContainer.textContent =
        "Loading applications...";


    const token =
        localStorage.getItem(
            "adminToken"
        );


    if (!token) {

        showLogin();

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/applications`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            if (response.status === 401) {

                localStorage.removeItem(
                    "adminToken"
                );

                showLogin();

                showError(
                    "Your admin session has expired."
                );

                return;

            }

            throw new Error(
                data.message ||
                "Could not load applications."
            );

        }


        displayApplications(
            data.applications || []
        );


    } catch (error) {

        console.error(
            "Applications error:",
            error
        );

        applicationsContainer.innerHTML =
            `<div class="error" style="display:block;">
                ${escapeHtml(error.message)}
            </div>`;

    }

}


// ============================================================
// DISPLAY APPLICATIONS
// ============================================================

function displayApplications(
    applications
) {

    if (
        !applications.length
    ) {

        applicationsContainer.innerHTML =
            `<div class="empty">
                No applications have been submitted yet.
            </div>`;

        return;

    }


    applicationsContainer.innerHTML =
        "";


    applications.forEach(
        application => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "application";


            item.innerHTML = `

                <h3>
                    ${escapeHtml(
                        application.name || "Unknown"
                    )}
                </h3>

                <p>
                    <strong>Nickname:</strong>
                    ${escapeHtml(
                        application.nickname || "—"
                    )}
                </p>

                <p>
                    <strong>Email:</strong>
                    ${escapeHtml(application.email || "—")}
                </p>

                <p>
                    <strong>Phone:</strong>
                    ${escapeHtml(application.phone || "—")}
                </p>

                <p>
                    <strong>Intention:</strong>
                    ${escapeHtml(
                        application.intention || "—"
                    )}
                </p>

                <p>
                    <strong>Jokes:</strong>
                    ${escapeHtml(
                        application.jokes || "—"
                    )}
                </p>

                <p>
                    <strong>Important:</strong>
                    ${escapeHtml(
                        application.important || "—"
                    )}
                </p>

                <p>
                    <strong>Message:</strong>
                    ${escapeHtml(
                        application.message || "—"
                    )}
                </p>

                <p>
                    <strong>Compatibility:</strong>
                    ${escapeHtml(
                        String(
                            application.compatibilityScore ?? "—"
                        )
                    )}%
                </p>

            `;


            applicationsContainer.appendChild(
                item
            );

        }
    );

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


// ============================================================
// SHOW LOGIN
// ============================================================

function showLogin() {

    dashboard.style.display =
        "none";

    loginSection.style.display =
        "block";

}


// ============================================================
// LOGOUT
// ============================================================

logoutButton.addEventListener(
    "click",
    function() {

        localStorage.removeItem(
            "adminToken"
        );

        showLogin();

        usernameInput.value = "";

        passwordInput.value = "";

    }
);


// ============================================================
// CHECK EXISTING LOGIN
// ============================================================

const existingToken =
    localStorage.getItem(
        "adminToken"
    );


if (existingToken) {

    showDashboard();

} else {

    showLogin();

}

</script>

</body>
</html>
